<body style="background-color: #0F172A; color: #94A3B8;">
  <div id="root">
    <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;background-color:#050505;color:#FFFFFF;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;user-select:none;">
      <style>
        @keyframes pulse-ring {
          0% { transform: scale(0.95); opacity: 0.5; box-shadow: 0 0 15px rgba(0, 240, 255, 0.4); }
          50% { transform: scale(1.05); opacity: 1; box-shadow: 0 0 30px rgba(0, 240, 255, 0.8), 0 0 50px rgba(138, 43, 226, 0.4); }
          100% { transform: scale(0.95); opacity: 0.5; box-shadow: 0 0 15px rgba(0, 240, 255, 0.4); }
        }
        @keyframes spin-orbit {
          0% { transform: rotate(0deg); }
          100% { transform: rotate(360deg); }
        }
        @keyframes shimmer-text {
          0%, 100% { opacity: 0.6; }
          50% { opacity: 1; }
        }
      </style>
      <div style="position:relative;width:64px;height:64px;display:flex;align-items:center;justify-content:center;margin-bottom:24px;">
        <div style="position:absolute;width:100%;height:100%;border-radius:50%;border:2px solid transparent;border-top-color:#00F0FF;border-right-color:#8A2BE2;animation:spin-orbit 1.2s cubic-bezier(0.5, 0, 0.5, 1) infinite;"></div>
        <div style="width:24px;height:24px;border-radius:50%;background:linear-gradient(135deg, #00F0FF, #8A2BE2);animation:pulse-ring 2s ease-in-out infinite;"></div>
      </div>
      <div style="font-size:15px;font-weight:600;letter-spacing:3px;color:#FFFFFF;text-transform:uppercase;margin-bottom:8px;">
        Vaibhav Pernole
      </div>
      <div style="font-size:12px;letter-spacing:1.5px;color:#00F0FF;text-transform:uppercase;animation:shimmer-text 1.5s ease-in-out infinite;">
        Initializing AI Portfolio...
      </div>
    </div>
  </div>
